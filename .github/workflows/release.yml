name: Release

on:
  push:
    branches: [release]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from package.json
        id: package-version
        run: echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: tag-check
        run: |
          if git rev-parse --verify "refs/tags/v${{ steps.package-version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if GitHub Release exists
        id: release-check
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate package
        if: steps.release-check.outputs.exists == 'false'
        run: |
          node bin/cli.js --help
          node -e "require('./src/environments'); require('./src/transformer'); require('./src/installer'); require('./src/version-check'); console.log('All modules load successfully')"
          node bin/cli.js --list --env claude

      - name: Check if version exists on npm
        id: npm-check
        run: |
          set -euo pipefail
          VERSION="${{ steps.package-version.outputs.version }}"
          PACKAGE_NAME="$(node -p 'require("./package.json").name')"

          set +e
          OUTPUT="$(npm view "${PACKAGE_NAME}@${VERSION}" version 2>&1)"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            if printf '%s\n' "$OUTPUT" | grep -qiE 'E404|404 Not Found|not found'; then
              echo "published=false" >> "$GITHUB_OUTPUT"
            else
              echo "npm view failed with an unexpected error:" >&2
              printf '%s\n' "$OUTPUT" >&2
              exit "$STATUS"
            fi
          fi

      - name: Publish to npm
        if: steps.npm-check.outputs.published == 'false'
        run: npm publish --provenance

      # /do:release rolls the commits since the last tag up into .changelogs/v{VERSION}.md
      # as part of the release PR, so by the time this runs the file is already on the
      # branch. The git-log fallback below only fires for a release cut by hand.
      - name: Generate changelog
        id: changelog
        if: steps.release-check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          CHANGELOG_FILE=".changelogs/v${VERSION}.md"

          if [ -f "$CHANGELOG_FILE" ]; then
            CHANGELOG=$(cat "$CHANGELOG_FILE")
          else
            echo "No ${CHANGELOG_FILE}; falling back to a raw commit list." >&2
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
            COMMIT_LOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges | grep -v "\[skip ci\]" || true)
            COMMIT_LOG=$(printf '%s\n' "$COMMIT_LOG" | head -50)
            CHANGELOG="$(printf '# Release v%s\n\n## Changes\n\n%s' "${VERSION}" "${COMMIT_LOG}")"
          fi

          DELIM="changelog_$(date +%s)"
          echo "changelog<<${DELIM}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.release-check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          name: v${{ steps.package-version.outputs.version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
